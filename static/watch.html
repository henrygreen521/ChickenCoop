<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop - Watch</title>
    <style>
        :root {
            --accent-color: #ff5722;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* --- PITCH BLACK & FALLING STARS BG --- */
        html, body {
            background: #000 !important;
            background-color: #000 !important;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        body::before {
            background-image: 
                radial-gradient(2px 2px at 40px 60px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 120px 180px, rgba(255,255,255,0.3), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 220px 90px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 310px 270px, rgba(255,255,255,0.5), rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 380px 150px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70px 320px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 190px 380px, rgba(255,255,255,0.4), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: starFall1 12s linear infinite;
        }
        body::after {
            background-image: 
                radial-gradient(1.5px 1.5px at 50px 100px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 250px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 280px 50px, rgba(255,255,255,0.2), rgba(0,0,0,0)),
                radial-gradient(3.5px 3.5px at 350px 320px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 370px, rgba(255,255,255,0.4), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: starFall2 20s linear infinite;
        }
        @keyframes starFall1 {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }
        @keyframes starFall2 {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }

        /* --- GLASSMORPHISM COMPONENTS --- */
        .navbar, .player-card, .panel-box, .episodes-panel, .sidebar-panel {
            background: linear-gradient(
                135deg, 
                rgba(255, 255, 255, 0.12) 0%, 
                rgba(255, 255, 255, 0.03) 50%, 
                rgba(255, 255, 255, 0.06) 100%
            ), rgba(20, 20, 20, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(25px) saturate(210%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(210%) !important;
            box-shadow: 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.25), 
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.05),
                0 20px 40px rgba(0, 0, 0, 0.5) !important;
            border-radius: 20px !important;
            color: #fff !important;
            position: relative;
            z-index: 2;
        }

        .navbar {
            border-radius: 0 !important;
            border-left: none !important;
            border-right: none !important;
            border-top: none !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .nav-link.active svg {
            color: var(--accent-color);
        }

        .container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
            color: #fff;
        }

        .watch-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-card {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .player-text h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .player-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: color 0.2s, transform 0.2s;
        }

        .star-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            transition: all 0.2s;
        }

        .star-btn:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        .star-btn.favorited {
            color: var(--text-main);
        }

        .star-btn.favorited svg {
            fill: var(--text-main);
            stroke: var(--text-main);
        }

        /* Custom ID Loader Box */
        .panel-box {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .custom-input, .type-select {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
            border-radius: 12px !important;
            padding: 10px 14px !important;
            backdrop-filter: blur(10px);
            outline: none;
            font-size: 0.9rem;
        }

        .custom-input {
            flex: 1;
        }

        .custom-input::placeholder {
            color: #888;
        }

        .type-select option {
            background: #111;
            color: #fff;
        }

        .custom-input:focus, .type-select:focus {
            border-color: var(--accent-color);
        }

        .action-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* TV Show Episode & Season Controls Panel */
        .episodes-panel {
            padding: 16px 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .episodes-controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ep-controls-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gear-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .gear-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .episode-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .ep-btn {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            min-width: 44px;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Sidebar Shortcuts Panel */
        .sidebar-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .search-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .sidebar-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 4px;
        }

        .recommendation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .rec-item {
            padding: 10px 12px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rec-item:hover, .rec-item.active {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .delete-shortcut {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
        }
        .delete-shortcut:hover {
            color: #ff5722;
        }

        .proxy-status {
            font-size: 0.75rem;
            color: #2ecc71;
            padding: 4px 8px;
            text-align: center;
            background: rgba(46, 204, 113, 0.1);
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-area">
            <span>ChickenCoop</span>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">HOME</a>
            <a href="/chat.html" class="nav-link">CHAT</a>
            <a href="/watch.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: inline-block; vertical-align: -2px; margin-right: 6px;">
                    <path d="M19 4H5C3.89 4 3 4.9 3 6V18C3 19.1 3.89 20 5 20H19C20.11 20 21 19.1 21 18V6C21 4.9 20.11 4 19 4ZM19 18H5V6H19V18Z"/>
                    <rect x="6" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="6" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="16" width="2" height="2" rx="0.5"/>
                    <polygon points="10,9.5 15,12 10,14.5"/>
                </svg>WATCH
            </a>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Watch</h1>
        
        <div class="watch-grid">
            <div class="player-section">
                <div class="player-card">
                    <div class="iframe-container">
                        <iframe id="media-frame" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                    <div class="player-info">
                        <div class="player-text">
                            <h2 id="media-title">Load Media</h2>
                            <p id="media-desc">Enter any TMDB or IMDb ID below to start streaming.</p>
                        </div>
                        <button class="star-btn" id="star-btn" onclick="toggleFavorite()" title="Save to Quick Shortcuts">
                            <svg viewBox="0 0 24 24">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Proxy Status -->
                <div id="proxy-status" class="proxy-status" style="display: none;">⏳ Initializing proxy...</div>

                <!-- Custom Direct ID Loader -->
                <div class="panel-box">
                    <div class="sidebar-heading" style="font-size:0.9rem;">Direct ID Loader</div>
                    <div class="input-row">
                        <select id="custom-type" class="type-select">
                            <option value="movie">Movie</option>
                            <option value="tv" selected>TV Show</option>
                        </select>
                        <input type="text" id="custom-id-input" class="custom-input" placeholder="Enter ID (e.g. 1399 or tt1300854)...">
                        <button class="action-btn" onclick="loadCustomMedia()">Load</button>
                    </div>
                </div>

                <!-- TV Show Season & Episode Panel -->
                <div class="episodes-panel" id="episodes-panel">
                    <div class="episodes-controls-top">
                        <span class="sidebar-heading" id="show-season-title" style="margin:0;">Episodes</span>
                        <div class="ep-controls-right">
                            <select id="season-select" class="type-select" onchange="changeSeason()" style="padding: 6px 10px; font-size: 0.85rem;"></select>
                            <button class="gear-btn" onclick="adjustLimits()" title="Change Seasons/Episodes Count">⚙️</button>
                        </div>
                    </div>
                    <div class="episode-buttons" id="episode-buttons-container"></div>
                </div>
            </div>

            <!-- Sidebar Quick Shortcuts -->
            <div class="sidebar-panel">
                <div class="search-hint">💡 Tip: Press <b>Ctrl + F</b> to search shortcuts</div>
                <div class="sidebar-heading">Quick Shortcuts</div>
                <div class="recommendation-list" id="results-list">
                    <div style="color: var(--text-muted); font-size: 0.85rem; padding: 4px;" id="empty-notice">No shortcuts saved yet. Star a loaded stream!</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let mediaLibrary = [];
        let proxyReady = false;

        try {
            const saved = localStorage.getItem('chickenCoopShortcuts');
            if (saved) mediaLibrary = JSON.parse(saved);
        } catch(e) {
            mediaLibrary = [];
        }

        const resultsList = document.getElementById('results-list');
        const frame = document.getElementById('media-frame');
        const mediaTitle = document.getElementById('media-title');
        const mediaDesc = document.getElementById('media-desc');
        const episodesPanel = document.getElementById('episodes-panel');
        const episodeButtonsContainer = document.getElementById('episode-buttons-container');
        const showSeasonTitle = document.getElementById('show-season-title');
        const seasonSelect = document.getElementById('season-select');
        const starBtn = document.getElementById('star-btn');
        const proxyStatusEl = document.getElementById('proxy-status');

        let currentActiveItem = null;

        // Initialize proxy on page load
        async function initializeProxy() {
            proxyStatusEl.style.display = 'block';
            proxyStatusEl.innerHTML = '⏳ Initializing proxy...';

            // Wait for Scramjet to load
            if (window.__isSjReady) {
                try {
                    await window.__isSjReady;
                    proxyReady = true;
                    proxyStatusEl.innerHTML = '✅ Proxy ready - Videos will be unblocked';
                    setTimeout(() => {
                        proxyStatusEl.style.display = 'none';
                    }, 3000);
                } catch (e) {
                    console.warn("Scramjet proxy initialization warning", e);
                    proxyStatusEl.innerHTML = '⚠️ Proxy error - using fallback';
                    setTimeout(() => {
                        proxyStatusEl.style.display = 'none';
                    }, 3000);
                }
            } else {
                proxyReady = true;
                proxyStatusEl.innerHTML = '✅ Proxy ready';
                setTimeout(() => {
                    proxyStatusEl.style.display = 'none';
                }, 3000);
            }
        }

        // Function to encode vidsrcme URLs through the Scramjet proxy
        function encodeUrlThroughProxy(url) {
            if (window.__isSj && typeof window.__isSj.encodeUrl === 'function') {
                return window.__isSj.encodeUrl(url);
            }
            // Fallback if proxy is not available
            return url;
        }

        function loadMedia(item) {
            if (!item || !item.id) return;

            // Hardcoded override for JoJo's Bizarre Adventure (ID: 45790)
            if (String(item.id) === '45790') {
                item.title = "JoJo's Bizarre Adventure";
                item.seasons = 6;
                item.episodesPerSeason = [26, 48, 39, 39, 38, 1];
            } else {
                if (!item.seasons) item.seasons = 3;
                if (!item.episodesPerSeason) item.episodesPerSeason = 24;
            }

            currentActiveItem = item;
            mediaTitle.innerText = item.title || `ID-${item.id}`;
            mediaDesc.innerText = item.desc || 'Manually loaded stream via vidsrcme.ru.';

            let targetUrl = '';
            if (item.type === 'tv') {
                targetUrl = `https://vidsrcme.ru/embed/tv/${item.id}/1/1`;
                setupSeasonsAndEpisodes(item, 1);
                if (episodesPanel) episodesPanel.style.display = 'flex';
            } else {
                targetUrl = `https://vidsrcme.ru/embed/movie/${item.id}`;
                if (episodesPanel) episodesPanel.style.display = 'none';
            }

            // Encode URL through proxy
            const proxiedUrl = encodeUrlThroughProxy(targetUrl);
            if (frame) frame.src = proxiedUrl;
            updateStarState();
            renderLibrary();
        }

        function loadCustomMedia() {
            const typeSelect = document.getElementById('custom-type');
            const idInput = document.getElementById('custom-id-input');
            if (!typeSelect || !idInput) return;

            const type = typeSelect.value;
            const id = idInput.value.trim();
            if (!id) return;

            const item = { 
                type: type, 
                id: id, 
                title: String(id) === '45790' ? "JoJo's Bizarre Adventure" : `ID-${id}`, 
                desc: `Custom loaded ${type} with ID ${id}.`, 
                seasons: 3, 
                episodesPerSeason: 24 
            };
            loadMedia(item);
        }

        function setupSeasonsAndEpisodes(show, selectedSeasonNum) {
            if (!seasonSelect) return;
            seasonSelect.innerHTML = '';
            const totalSeasons = show.seasons || 3;
            
            for (let s = 1; s <= totalSeasons; s++) {
                const opt = document.createElement('option');
                opt.value = s;
                opt.innerText = `Season ${s}`;
                if (s === selectedSeasonNum) opt.selected = true;
                seasonSelect.appendChild(opt);
            }

            renderEpisodesForSeason(show, selectedSeasonNum);
        }

        function changeSeason() {
            if (!currentActiveItem || !seasonSelect) return;
            const selectedSeason = parseInt(seasonSelect.value);
            renderEpisodesForSeason(currentActiveItem, selectedSeason);
        }

        function adjustLimits() {
            if (!currentActiveItem || currentActiveItem.type !== 'tv') return;
            
            let currentSeasons = currentActiveItem.seasons || 3;
            const sInput = prompt("Set total seasons:", currentSeasons);
            if (sInput === null) return;
            const newSeasons = parseInt(sInput) || 3;

            let defaultEpVal = 24;
            if (Array.isArray(currentActiveItem.episodesPerSeason)) {
                defaultEpVal = currentActiveItem.episodesPerSeason.join(', ');
            } else {
                defaultEpVal = currentActiveItem.episodesPerSeason || 24;
            }

            const eInput = prompt(`Set episodes per season (one number for all, or comma-separated, e.g. 26, 48, 39):`, defaultEpVal);
            if (eInput === null) return;

            let parsedEpisodes;
            if (eInput.includes(',')) {
                parsedEpisodes = eInput.split(',').map(n => parseInt(n.trim()) || 12);
            } else {
                parsedEpisodes = parseInt(eInput) || 24;
            }

            currentActiveItem.seasons = newSeasons;
            currentActiveItem.episodesPerSeason = parsedEpisodes;

            const idx = mediaLibrary.findIndex(i => i.id === currentActiveItem.id && i.type === currentActiveItem.type);
            if (idx > -1) {
                mediaLibrary[idx] = currentActiveItem;
                try {
                    localStorage.setItem('chickenCoopShortcuts', JSON.stringify(mediaLibrary));
                } catch(e) {}
            }

            setupSeasonsAndEpisodes(currentActiveItem, 1);
        }
        window.adjustLimits = adjustLimits;

        function renderEpisodesForSeason(show, seasonNum) {
            if (!episodeButtonsContainer || !showSeasonTitle) return;
            episodeButtonsContainer.innerHTML = '';
            showSeasonTitle.innerText = `${show.title} - Season ${seasonNum}`;

            let epCount = 24;
            if (show.episodesPerSeason) {
                if (Array.isArray(show.episodesPerSeason)) {
                    epCount = show.episodesPerSeason[seasonNum - 1] || 12;
                } else {
                    epCount = show.episodesPerSeason;
                }
            }

            for (let ep = 1; ep <= epCount; ep++) {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${ep === 1 ? 'active' : ''}`;
                btn.innerText = ep;
                btn.onclick = () => {
                    const targetUrl = `https://vidsrcme.ru/embed/tv/${show.id}/${seasonNum}/${ep}`;
                    // Encode URL through proxy
                    const proxiedUrl = encodeUrlThroughProxy(targetUrl);
                    if (frame) frame.src = proxiedUrl;
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                episodeButtonsContainer.appendChild(btn);
            }
        }

        function toggleFavorite() {
            if (!currentActiveItem || !currentActiveItem.id) return;

            const existingIndex = mediaLibrary.findIndex(i => i.id === currentActiveItem.id && i.type === currentActiveItem.type);

            if (existingIndex > -1) {
                mediaLibrary.splice(existingIndex, 1);
            } else {
                let defaultName = currentActiveItem.title;
                if (!defaultName || defaultName === 'Load Media' || defaultName.startsWith('Load')) {
                    defaultName = `ID-${currentActiveItem.id}`;
                }
                let customName = prompt("Enter a custom name for this shortcut:", defaultName);
                if (customName === null) return;

                currentActiveItem.title = customName.trim() !== '' ? customName.trim() : `ID-${currentActiveItem.id}`;
                mediaLibrary.push(currentActiveItem);
            }

            try {
                localStorage.setItem('chickenCoopShortcuts', JSON.stringify(mediaLibrary));
            } catch(e) {}
            
            renderLibrary();
            updateStarState();
        }
        window.toggleFavorite = toggleFavorite;

        function updateStarState() {
            if (!starBtn) return;
            if (!currentActiveItem || !currentActiveItem.id) {
                starBtn.classList.remove('favorited');
                return;
            }
            const isFav = mediaLibrary.some(i => i.id === currentActiveItem.id && i.type === currentActiveItem.type);
            if (isFav) {
                starBtn.classList.add('favorited');
            } else {
                starBtn.classList.remove('favorited');
            }
        }

        function deleteShortcut(event, id, type) {
            event.stopPropagation();
            mediaLibrary = mediaLibrary.filter(i => !(i.id === id && i.type === type));
            try {
                localStorage.setItem('chickenCoopShortcuts', JSON.stringify(mediaLibrary));
            } catch(e) {}
            renderLibrary();
            updateStarState();
        }
        window.deleteShortcut = deleteShortcut;

        function renderLibrary() {
            if (!resultsList) return;
            resultsList.innerHTML = '';
            if (!mediaLibrary || mediaLibrary.length === 0) {
                resultsList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 4px;" id="empty-notice">No shortcuts saved yet. Star a loaded stream!</div>';
                return;
            }

            mediaLibrary.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'rec-item';
                if (currentActiveItem && currentActiveItem.id === item.id && currentActiveItem.type === item.type) {
                    div.classList.add('active');
                }
                div.innerHTML = `
                    <span>${item.title}</span>
                    <button class="delete-shortcut" onclick="deleteShortcut(event, '${item.id}', '${item.type}')" title="Remove">✕</button>
                `;
                div.onclick = () => loadMedia(item);
                resultsList.appendChild(div);
            });
        }

        // Initialize proxy when page loads
        window.addEventListener('load', initializeProxy);
        renderLibrary();
    </script>
</body>
</html>
